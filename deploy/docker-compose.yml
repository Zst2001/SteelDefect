services:
  mysql:
    image: mysql:8.0
    container_name: steel_lab_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-labdev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steel_lab}
      MYSQL_USER: ${MYSQL_USER:-lab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labdev_mysql}
    ports:
      - "3307:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
    volumes:
      - steel_lab_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-labdev_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: steel_lab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --databases 16
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  steel_lab_mysql_data:
